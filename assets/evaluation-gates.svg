  <text x="399" y="207" class="mono tx3" font-size="8.8">Frozen Qwen3-ASR-1.7B</text>
  <rect x="390" y="220" width="168" height="50" rx="6" fill="#FFFFFF" stroke="#E6D5CA" stroke-width="1"/>
  <text x="399" y="235" class="sans w6 tx2" font-size="10.2">Tail latency &amp; RTF</text>
  <text x="399" y="250" class="mono w7 txr" font-size="11">≤ 1.03× B₀</text>
  <text x="399" y="263" class="mono tx3" font-size="8.8">Latency, RTF, TTFA (3% cap)</text>
  <rect x="390" y="276" width="168" height="50" rx="6" fill="#FFFFFF" stroke="#E6D5CA" stroke-width="1"/>
  <text x="399" y="291" class="sans w6 tx2" font-size="10.2">Streaming cadence</text>
  <text x="399" y="306" class="mono w7 txr" font-size="11">≥ 95% multi-chunk</text>
  <text x="399" y="319" class="mono tx3" font-size="8.8">c50 ≥ 0.97× B₀ (PCM)</text>
  <rect x="580" y="120" width="188" height="218" rx="8" fill="#F2F3EE" stroke="#D5DBD4" stroke-width="1.2"/>
  <path d="M588 120 H760 A8 8 0 0 1 768 128 V154 H580 V128 A8 8 0 0 1 588 120 Z" fill="#EEF1EF"/>
  <text x="592" y="141" class="sans w7 txm" font-size="12.5">ASR · 3 tasks</text>
  <text x="757" y="141" text-anchor="end" class="mono tx3" font-size="9.5">c = 32</text>
  <line x1="580" y1="154" x2="768" y2="154" stroke="#D5DBD4" stroke-width="1"/>
  <rect x="590" y="164" width="168" height="50" rx="6" fill="#FFFFFF" stroke="#D6DCD6" stroke-width="1"/>
  <text x="599" y="179" class="sans w6 tx2" font-size="10.2">EN WER &amp; ZH CER</text>
  <text x="599" y="194" class="mono w7 txm" font-size="11">≤ 2.0% or 1.03× B₀</text>
  <text x="599" y="207" class="mono tx3" font-size="8.8">1,088 EN + 2,020 ZH</text>
  <rect x="590" y="220" width="168" height="50" rx="6" fill="#FFFFFF" stroke="#D6DCD6" stroke-width="1"/>
  <text x="599" y="235" class="sans w6 tx2" font-size="10.2">Tail latency &amp; TTFT</text>
  <text x="599" y="250" class="mono w7 txm" font-size="11">P95 ≤ 1.03× B₀</text>
  <text x="599" y="263" class="mono tx3" font-size="8.8">Latency, RTF, TTFT P95</text>
  <rect x="590" y="276" width="168" height="50" rx="6" fill="#FFFFFF" stroke="#D6DCD6" stroke-width="1"/>
  <text x="599" y="291" class="sans w6 tx2" font-size="10.2">Streaming SSE</text>
  <text x="599" y="306" class="mono w7 txm" font-size="11">single_delta ≤ 5%</text>
  <text x="599" y="319" class="mono tx3" font-size="8.8">≥ 80% speaker tags (TD)</text>
  <line x1="782" y1="218" x2="812" y2="218" stroke="#B5452A" stroke-width="1.7" marker-end="url(#e-rust)"/>
  <text x="797" y="209" text-anchor="middle" class="mono w6 txr" font-size="9.5">score</text>
  <rect x="816" y="84" width="276" height="268" rx="10" fill="#FFFFFF" stroke="#DDD9CE" stroke-width="1.3"/>
  <text x="832" y="108" class="mono w6 tx3" font-size="11.5">03</text>
  <text x="1076" y="108" text-anchor="end" class="cap txr">COMPOSITE VERDICT</text>
  <line x1="832" y1="118" x2="1076" y2="118" stroke="#ECE9E0" stroke-width="1"/>
  <rect x="830" y="130" width="248" height="70" rx="7" fill="#FBF0EC" stroke="#E2BFB3" stroke-width="1.15"/>
  <text x="954.0" y="158" text-anchor="middle" class="mono w7 tx" font-size="14">score = R<tspan dy="3" font-size="10">s</tspan><tspan dy="-8" font-size="9.6">2/3</tspan><tspan dy="5"> · R</tspan><tspan dy="3" font-size="10">n</tspan><tspan dy="-8" font-size="9.6">1/3</tspan></text>
  <text x="954.0" y="182" text-anchor="middle" class="mono tx3" font-size="9.8">ASR: R<tspan dy="2" font-size="8">m</tspan><tspan dy="-2"> = √(R</tspan><tspan dy="2" font-size="8">m,en</tspan><tspan dy="-2"> · R</tspan><tspan dy="2" font-size="8">m,zh</tspan><tspan dy="-2">)</tspan></text>
  <rect x="830" y="210" width="248" height="58" rx="7" fill="#FAF8F4" stroke="#E4E0D6" stroke-width="1"/>
  <text x="954.0" y="229" text-anchor="middle" class="sans w6 tx" font-size="11.5">Strict Dual-Mode Improvement</text>
  <text x="954.0" y="246" text-anchor="middle" class="mono w6 txr" font-size="10.8">R<tspan dy="2.5" font-size="8.5">s</tspan><tspan dy="-2.5"> &gt; 1.0  and  R</tspan><tspan dy="2.5" font-size="8.5">n</tspan><tspan dy="-2.5"> &gt; 1.0</tspan></text>
  <text x="954.0" y="260" text-anchor="middle" class="sans tx3" font-size="9.6">Every scored mode &amp; language must improve</text>
  <rect x="830" y="278" width="119" height="58" rx="7" fill="url(#e-clay)" stroke="#B64B28" stroke-width="1.2"/>
  <text x="889.5" y="297" text-anchor="middle" class="cap txw2" font-size="9.5">ALL PASS</text>
  <text x="889.5" y="314" text-anchor="middle" class="mono w7 txw" font-size="11.5">reward = score</text>
  <text x="889.5" y="328" text-anchor="middle" class="sans txw2" font-size="9.5">Updates frontier</text>
  <rect x="959" y="278" width="119" height="58" rx="7" fill="#FAF8F4" stroke="#A8A49B" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="1018.5" y="297" text-anchor="middle" class="cap tx3" font-size="9.5">ANY FAIL</text>
  <text x="1018.5" y="314" text-anchor="middle" class="mono w7 tx2" font-size="11.5">reward = 0.0</text>
  <text x="1018.5" y="328" text-anchor="middle" class="sans tx3" font-size="9.5">Rejected candidate</text>
  <rect x="28" y="366" width="1064" height="36" rx="8" fill="#F2EFE7" stroke="#DFDBD0" stroke-width="1"/>
  <text x="46" y="388" class="cap txa">ORACLE HEALTH CHECK</text>
  <text x="380" y="388" text-anchor="middle" class="mono w5 tx2" font-size="11">--agent oracle (SHA-256 unmodified source)</text>
  <line x1="548" y1="384" x2="584" y2="384" stroke="#5C5A54" stroke-width="1.3" marker-end="url(#e-ink)"/>
  <text x="716" y="388" text-anchor="middle" class="sans w5 tx2" font-size="11.5">Runs full 3× repeats &amp; all guards</text>
  <line x1="848" y1="384" x2="884" y2="384" stroke="#B5452A" stroke-width="1.4" marker-end="url(#e-rust)"/>
  <text x="984" y="388" text-anchor="middle" class="mono w7 txr" font-size="11.5">reward.json → 1.0</text>
</svg>
