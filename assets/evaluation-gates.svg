  <text x="557" y="141" text-anchor="end" class="mono tx3" font-size="9.5">c = 16</text>
  <line x1="380" y1="154" x2="568" y2="154" stroke="#EAD7CC" stroke-width="1"/>
  <rect x="390" y="164" width="168" height="50" rx="6" fill="#FFFFFF" stroke="#E6D5CA" stroke-width="1"/>
  <text x="399" y="179" class="sans w6 tx2" font-size="10.2">Speech quality</text>
