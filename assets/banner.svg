<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="470" viewBox="0 0 1440 470" role="img" aria-labelledby="title desc">
<title id="title">OpenRSI AI Infra</title>
<desc id="desc">A benchmark for coding agents that optimize AI serving systems. Ten models, twelve tasks, two baseline agents.</desc>
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#cbd1da" opacity=".6"/></pattern>
  <linearGradient id="line" x1="0" x2="1"><stop stop-color="#5b59db"/><stop offset="1" stop-color="#30928a"/></linearGradient>
</defs>
<rect width="1440" height="470" rx="22" fill="#f4f4ef"/>
<rect x="870" width="570" height="470" fill="url(#grid)"/>
<rect x="50" y="46" width="8" height="22" rx="3" fill="#615bd4"/>
<text x="72" y="63" fill="#596171" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="3">OPENRSI FOUNDATION</text>
<text x="48" y="159" fill="#192434" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="700" letter-spacing="-3">OpenRSI AI Infra</text>
<text x="52" y="213" fill="#435063" font-family="Arial, Helvetica, sans-serif" font-size="26">Can agents make AI infrastructure faster?</text>
<text x="52" y="255" fill="#667181" font-family="Arial, Helvetica, sans-serif" font-size="19">Real serving stacks. Fixed model weights. Measurable gains.</text>
<g font-family="Arial, Helvetica, sans-serif">
  <rect x="52" y="312" width="173" height="73" rx="12" fill="#ffffff" stroke="#dce1e4"/>
  <text x="72" y="343" fill="#283649" font-size="25" font-weight="700">10</text><text x="72" y="368" fill="#6c7580" font-size="15">models</text>
  <rect x="239" y="312" width="173" height="73" rx="12" fill="#ffffff" stroke="#dce1e4"/>
  <text x="259" y="343" fill="#283649" font-size="25" font-weight="700">12</text><text x="259" y="368" fill="#6c7580" font-size="15">task packages</text>
  <rect x="426" y="312" width="173" height="73" rx="12" fill="#ffffff" stroke="#dce1e4"/>
  <text x="446" y="343" fill="#283649" font-size="25" font-weight="700">2</text><text x="446" y="368" fill="#6c7580" font-size="15">baseline agents</text>
</g>
<g transform="translate(911 99)">
  <rect width="462" height="287" rx="18" fill="#182535"/>
  <text x="27" y="37" fill="#cbd5e2" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="2">THE OPTIMIZATION LOOP</text>
  <path d="M30 211 H100 V192 H175 V162 H250 V130 H325 V88 H405" fill="none" stroke="url(#line)" stroke-width="6" stroke-linejoin="round"/>
  <g fill="#a2e3cf"><circle cx="100" cy="192" r="5"/><circle cx="175" cy="162" r="5"/><circle cx="250" cy="130" r="5"/><circle cx="325" cy="88" r="5"/><circle cx="405" cy="88" r="5"/></g>
  <path d="M30 227 H430" stroke="#344354"/>
  <text x="28" y="260" fill="#c8d5e5" font-family="Arial, Helvetica, sans-serif" font-size="16">Profile  →  Optimize  →  Verify  →  Repeat</text>
</g>
<text x="52" y="434" fill="#7d8792" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="1.5">SGLANG-OMNI  /  TTS + ASR  /  RSI-HARNESS</text>
<text x="1356" y="417" text-anchor="end" fill="#7d8792" font-family="Arial, Helvetica, sans-serif" font-size="12">Illustrative workflow; not a measured curve.</text>
</svg>
