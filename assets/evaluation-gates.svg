<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 418" width="1120" height="418" role="img" aria-label="Evaluation protocol and verification funnel: hardware isolation and anti-cheat guards, dual-mode TTS and ASR quality and streaming gates, and composite throughput score">
  <defs>
    <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .cap  { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 10.5px; font-weight: 600; letter-spacing: 0.09em; }
    .tx   { fill: #181715; }
    .tx2  { fill: #42403B; }
    .tx3  { fill: #737068; }
    .txr  { fill: #B5452A; }
    .txa  { fill: #A66816; }
    .txm  { fill: #3E5A4E; }
    .txw  { fill: #FFFFFF; }
    .txw2 { fill: #FFF3ED; }
    .w4   { font-weight: 400; }
    .w5   { font-weight: 500; }
    .w6   { font-weight: 600; }
    .w7   { font-weight: 700; }
</style>
    <marker id="e-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1L9 5L0 9z" fill="#5C5A54"/>
    </marker>
    <marker id="e-rust" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 1L9 5L0 9z" fill="#B5452A"/>
    </marker>
    <linearGradient id="e-clay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D9724B"/>
      <stop offset="100%" stop-color="#C85A35"/>
    </linearGradient>
  </defs>
  <rect x="1.5" y="1.5" width="1117" height="415" rx="14" fill="#FAF8F4" stroke="#DFDBD0" stroke-width="1.5"/>
  <text x="28" y="29" class="cap txr">EVALUATION PROTOCOL · CLEAN-IMAGE VERIFICATION FUNNEL</text>
  <text x="28" y="52" class="sans w6 tx" font-size="17" letter-spacing="-0.015em">Hardware isolation, dual-mode quality &amp; streaming gates, and composite scoring</text>
  <rect x="812" y="34" width="280" height="24" rx="12" fill="#F2EFE7" stroke="#DAD6CA" stroke-width="1"/>
  <text x="952" y="50" text-anchor="middle" class="mono w5 tx2" font-size="10.6">3× repeats / mode · any fail → 0</text>
  <line x1="28" y1="68" x2="1092" y2="68" stroke="#E4E0D6" stroke-width="1.2"/>
  <rect x="28" y="84" width="304" height="268" rx="10" fill="#FFFFFF" stroke="#DDD9CE" stroke-width="1.3"/>
  <text x="44" y="108" class="mono w6 tx3" font-size="11.5">01</text>
  <text x="316" y="108" text-anchor="end" class="cap tx3">ISOLATION &amp; INTEGRITY</text>
  <line x1="44" y1="118" x2="316" y2="118" stroke="#ECE9E0" stroke-width="1"/>
  <text x="44" y="137" class="sans tx3" font-size="11.2">Enforced on every clean-image Judge run</text>
  <rect x="42" y="148" width="276" height="33" rx="6" fill="#FAF8F4" stroke="#E4E0D6" stroke-width="1"/>
  <rect x="49" y="155.5" width="44" height="18" rx="4" fill="#FDF5E6" stroke="#E3C184" stroke-width="0.9"/>
  <text x="71" y="168" text-anchor="middle" class="mono w7 txa" font-size="9.5">NUMA</text>
  <text x="102" y="168.5" class="sans w5 tx2" font-size="11.3">16 idle non-SMT physical cores</text>
  <rect x="42" y="187" width="276" height="33" rx="6" fill="#FAF8F4" stroke="#E4E0D6" stroke-width="1"/>
  <rect x="49" y="194.5" width="44" height="18" rx="4" fill="#FDF5E6" stroke="#E3C184" stroke-width="0.9"/>
  <text x="71" y="207" text-anchor="middle" class="mono w7 txa" font-size="9.5">HOST</text>
  <text x="102" y="207.5" class="sans w5 tx2" font-size="11.3">peak_foreign_cores ≤ 2.0</text>
  <rect x="42" y="226" width="276" height="33" rx="6" fill="#FAF8F4" stroke="#E4E0D6" stroke-width="1"/>
  <rect x="49" y="233.5" width="44" height="18" rx="4" fill="#FDF5E6" stroke="#E3C184" stroke-width="0.9"/>
  <text x="71" y="246" text-anchor="middle" class="mono w7 txa" font-size="9.5">GPU</text>
  <text x="102" y="246.5" class="sans w5 tx2" font-size="11.3">0 MiB residual handoff check</text>
  <rect x="42" y="265" width="276" height="33" rx="6" fill="#FAF8F4" stroke="#E4E0D6" stroke-width="1"/>
  <rect x="49" y="272.5" width="44" height="18" rx="4" fill="#FDF5E6" stroke="#E3C184" stroke-width="0.9"/>
  <text x="71" y="285" text-anchor="middle" class="mono w7 txa" font-size="9.5">HASH</text>
  <text x="102" y="285.5" class="sans w5 tx2" font-size="11.3">Frozen weights, splits &amp; sampling</text>
  <rect x="42" y="304" width="276" height="33" rx="6" fill="#FAF8F4" stroke="#E4E0D6" stroke-width="1"/>
  <rect x="49" y="311.5" width="44" height="18" rx="4" fill="#FDF5E6" stroke="#E3C184" stroke-width="0.9"/>
  <text x="71" y="324" text-anchor="middle" class="mono w7 txa" font-size="9.5">AST</text>
  <text x="102" y="324.5" class="sans w5 tx2" font-size="11.3">Liveness &amp; no cross-request cache</text>
  <line x1="332" y1="218" x2="362" y2="218" stroke="#5C5A54" stroke-width="1.6" marker-end="url(#e-ink)"/>
  <text x="347" y="209" text-anchor="middle" class="mono tx3" font-size="9.5">run</text>
  <rect x="366" y="84" width="416" height="268" rx="11" fill="#F2EFE7" stroke="#DAD6CA" stroke-width="1.3"/>
